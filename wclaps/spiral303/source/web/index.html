<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiral303</title>
<!-- The paths are relative on purpose: the host serves the page from the
     plugin's own memory under a path of its own, and only a relative link
     stays inside it. An absolute "/style.css" would go to the web server
     instead of to the plugin. -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- A canvas is nothing at all to anyone who cannot see it, so it says what is
     on it. The keyboard works through the window, not through the element. -->
<canvas id="ui" aria-label="Spiral303, a TB-303 bassline synthesizer and its sequencer"></canvas>
<!-- Visible until the page has a context to paint into: the host that cannot run
     the module never runs this markup's own script, so nothing would reveal a
     message that starts hidden. -->
<div id="fallback">
  <p>This host cannot show the Spiral303 interface.</p>
  <p>The plugin still works: the parameters are in the host’s own window.</p>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
